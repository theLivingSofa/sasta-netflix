<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - MyFlix</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

  <style>
    body {
      margin: 0;
      height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      background: radial-gradient(circle at top, #1e1e1e, #0d0d0d);
      display: flex;
      flex-direction: column;
      justify-content: center; /* Keep content centered vertically */
      align-items: center;
      color: #ffffff;
      position: relative;
      padding-bottom: 4rem;
      box-sizing: border-box;
      overflow: hidden;
    }

    .login-box {
      background-color: #141414;
      padding: 2.5rem;
      border-radius: 20px;
      box-shadow: 0 0 25px rgba(255, 71, 87, 0.2);
      width: 90%;
      max-width: 400px;
      text-align: center;
      transition: all 0.3s ease;
      margin: 0 auto; /* Center the login box horizontally */
    }

    .login-box:hover {
      box-shadow: 0 0 35px rgba(255, 71, 87, 0.4);
    }

    .login-box h2 {
      margin-bottom: 2rem;
      font-size: 1.8rem;
      color: #ff4757;
    }

    .input-field, .login-btn {
      width: 100%;
      max-width: 320px;
      padding: 0.75rem;
      margin: 0.5rem auto;
      border-radius: 10px;
      font-size: 1rem;
      display: block;
      border: none;
    }

    .input-field {
      background-color: #2c2c2c;
      color: #f1f1f1;
    }

    .input-field:focus {
      outline: none;
      background-color: #3b3b3b;
    }

    .login-btn {
      background-color: #ff4757;
      color: white;
      cursor: pointer;
    }

    .login-btn:hover {
      background-color: #e84153;
    }

    .signup-link {
      margin-top: 1.5rem;
      font-size: 0.9rem;
      color: #ddd;
    }

    .signup-link a {
      color: #ff6b81;
      text-decoration: none;
      font-weight: bold;
    }

    .signup-link a:hover {
      text-decoration: underline;
    }

    footer {
      text-align: center;
      padding: 1rem;
      font-size: 0.9rem;
      color: #666;
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      background-color: #141414;
    }
  </style>
</head>
<body>

  <div class="login-box">
    <h2>Login to MyFlix</h2>
    <input type="email" id="email" class="input-field" placeholder="Email">
    <input type="password" id="password" class="input-field" placeholder="Password">
    <button class="login-btn" onclick="login()">Login</button>
    <p class="signup-link">
      Don't have an account? <a href="signup.html">Sign Up</a>
    </p>
  </div>

  <footer>
    Built with ❤️ by theLivingSofa | Keep this link private.
  </footer>

  <script>
    // Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyBrChvVIYHU8pP7BeDZlEW8SLhpkTaQAaQ",
      authDomain: "myflix-9e38a.firebaseapp.com",
      projectId: "myflix-9e38a",
      appId: "1:164149311168:web:763ba10160d94fc282df25"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    // Login
    function login() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      auth.signInWithEmailAndPassword(email, password)
        .then(() => window.location.href = "index.html")
        .catch(err => alert("Login Error: " + err.message));
    }

    // Signup
    function signup() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      auth.createUserWithEmailAndPassword(email, password)
        .then(() => alert("Sign Up Successful. You can log in now."))
        .catch(err => alert("Sign Up Error: " + err.message));
    }
  </script>

</body>
</html>
