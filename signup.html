<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Sign Up - MyFlix</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <style>
        body {
            margin: 0;
            height: 100vh;
            font-family: 'Segoe UI', sans-serif;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            padding-bottom: 4rem;
            box-sizing: border-box;
            overflow: hidden; /* Prevent scrollbars */
        }

        /* Add this CSS for the animated background */
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://media2.giphy.com/media/v1.Y2lkPTc5MGI3NjExOXB1b3RsNW9nMzdqM3BwcnoxaTJkYWNyYmU5b3Z1YnM2Y2pvZDFpayZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/798oH0WDEQnicM4857/giphy.gif'); /* Replace with a new image URL */
            background-size: cover;
            background-position: center;
            animation: moveBackground 10s linear infinite; /* Combine fade and move */
            opacity: 0.6; /* Adjust opacity as needed */
            z-index: -1;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 0.4; }
        }

        @keyframes moveBackground {
            from { background-position: center; }
            to { background-position: 10% center; } /* Adjust the ending position for the animation */
        }


        .signup-box {
            background-color: rgba(20, 20, 20, 0.7); /* Add some transparency to the box */
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 0 25px rgba(255, 71, 87, 0.2);
            width: 90%;
            max-width: 400px;
            text-align: center;
            transition: all 0.3s ease;
            margin: 0 auto;
            z-index: 1; /* Ensure the signup box is above the background */
        }

        .signup-box:hover {
            box-shadow: 0 0 35px rgba(255, 71, 87, 0.4);
        }

        .signup-box h2 {
            margin-bottom: 2rem;
            font-size: 1.8rem;
            color: #ff4757;
        }

        .input-field, .signup-btn {
            width: 100%;
            max-width: 320px;
            padding: 0.75rem;
            margin: 0.5rem auto;
            border-radius: 10px;
            font-size: 1rem;
            display: block;
            border: none;
        }

        .input-field {
            background-color: #2c2c2c;
            color: #f1f1f1;
        }

        .input-field:focus {
            outline: none;
            background-color: #3b3b3b;
        }

        .signup-btn {
            background-color: #ff4757;
            color: white;
            cursor: pointer;
        }

        .signup-btn:hover {
            background-color: #e84153;
        }

        .login-link {
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: #ddd;
        }

        .login-link a {
            color: #ff6b81;
            text-decoration: none;
            font-weight: bold;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        footer {
            text-align: center;
            padding: 1rem;
            font-size: 0.9rem;
            color: white;
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: rgba(20, 20, 20, 0.7); /* Make footer background transparent */
            z-index: 1; /* Ensure footer is above the background */
        }
    </style>
</head>
<body>

<div class="signup-box">
    <h2>Sign Up to MyFlix</h2>
    <input type="email" id="email" class="input-field" placeholder="Email">
    <input type="password" id="password" class="input-field" placeholder="Password">
    <button class="signup-btn" onclick="signup()">Sign Up</button>
    <p class="login-link">
        Already have an account? <a href="login.html">Log in</a>
    </p>
</div>

<footer>
    Built with ❤️ by theLivingSofa | Keep this link private.
</footer>

<script>
    // Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyBrChvVIYHU8pP7BeDZlEW8SLhpkTaQAaQ",
      authDomain: "myflix-9e38a.firebaseapp.com",
      projectId: "myflix-9e38a",
      appId: "1:164149311168:web:763ba10160d94fc282df25"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    // Signup
    function signup() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        auth.createUserWithEmailAndPassword(email, password)
            .then(() => {
                alert("Sign Up Successful. You can log in now.");
                window.location.href = "login.html"; // Redirect to login
            })
            .catch(err => alert("Sign Up Error: " + err.message));
    }
</script>

</body>
</html>
